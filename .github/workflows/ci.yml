name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Clean fixture must pass
        run: galint tests/fixtures/clean.yml
      - name: Regression fixture must fail with GAL001
        # `set +e` нужен, потому что galint на находках возвращает 1: без него
        # `bash -e` завершил бы шаг до проверки кода. Дефолтный shell Actions —
        # `bash -e` без pipefail, но свой код выхода мы всё равно проверяем явно.
        run: |
          set +e
          out="$(galint tests/fixtures/regression-0003.yml --format json)"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "ожидался код выхода 1, получен $rc"; exit 1
          fi
          echo "$out" | grep -q '"code": "GAL001"'

  package:
    # Упаковка проверяется на каждом PR, а не только на теге: битый sdist или
    # испорченные метаданные иначе всплывут в момент публикации.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Wheel must contain every module
        run: |
          python -m zipfile -l dist/*.whl | tee wheel.txt
          for module in __init__.py __main__.py cli.py linter.py; do
            grep -q "grafana_alert_lint/$module" wheel.txt || {
              echo "в wheel нет grafana_alert_lint/$module"; exit 1; }
          done
      - name: Install built wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/galint --version
          /tmp/wheel-venv/bin/python -m grafana_alert_lint --version
          /tmp/wheel-venv/bin/galint tests/fixtures/clean.yml
      - name: Tests from the sdist must pass
        run: |
          tar xzf dist/*.tar.gz
          cd grafana_alert_lint-*
          python -m pip install --quiet pytest
          python -m pytest -q
