name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Clean fixture must pass
        run: galint tests/fixtures/clean.yml
      - name: Regression fixture must fail (GAL001)
        run: |
          if galint tests/fixtures/regression-0003.yml; then
            echo "линтер не поймал регрессию 0003"; exit 1
          fi
          galint tests/fixtures/regression-0003.yml --format json | grep -q GAL001
