name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Clean fixture must pass
        run: galint tests/fixtures/clean.yml
      - name: Regression fixture must fail with GAL001
        # `set +e` вокруг galint обязателен: на находках он возвращает 1, и при
        # `-eo pipefail` (дефолт GitHub Actions) пайплайн с grep дал бы 1 даже
        # когда линтер сработал правильно.
        run: |
          set +e
          out="$(galint tests/fixtures/regression-0003.yml --format json)"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "ожидался код выхода 1, получен $rc"; exit 1
          fi
          echo "$out" | grep -q '"code": "GAL001"'
