name: Publish to PyPI

# Публикация только по тегу: `git tag vX.Y.Z && git push --tags`.
# Ручной запуск с ветки намеренно не разрешён — иначе можно выпустить
# непроверенный коммит в обход теста.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "тег v$tag не совпадает с версией $version в pyproject.toml"; exit 1
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test before build
        run: |
          ruff check .
          pytest
      - name: Build and check metadata
        env:
          # фиксированное время сборки: два прогона дают одинаковый wheel
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read         # права job заменяют права workflow
      id-token: write        # OIDC Trusted Publishing
      attestations: write    # PEP 740 provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
