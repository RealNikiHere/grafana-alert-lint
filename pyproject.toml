[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grafana-alert-lint"
dynamic = ["version"]
description = "Linter for provisioned Grafana alerting rules: finds rules that silently do not work"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Niki" }]
keywords = ["grafana", "alerting", "prometheus", "lint", "observability", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0,<10", "ruff>=0.6,<1"]

[project.scripts]
galint = "grafana_alert_lint.cli:main"

[project.urls]
Homepage = "https://github.com/RealNikiHere/grafana-alert-lint"
Repository = "https://github.com/RealNikiHere/grafana-alert-lint"
Issues = "https://github.com/RealNikiHere/grafana-alert-lint/issues"
Changelog = "https://github.com/RealNikiHere/grafana-alert-lint/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "grafana_alert_lint.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
